<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'DM Sans', sans-serif;
  background: #EDF2F4;
  color: #2B2D42;
  min-height: 100vh;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ── CANVAS ── */
#canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
}

/* ── ARKA PLAN ── */
.arka-plan {
  position: fixed;
  inset: 0;
  z-index: 0;
  transition: background 1s;
}

/* ── ANA İÇERİK ── */
.icerik {
  position: relative;
  z-index: 10;
  text-align: center;
  padding: 40px 24px;
  max-width: 480px;
  width: 100%;
}

/* ── EKRAN 1: KAPALII AMBALAJ ── */
#ekran-kapali {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}

.ambalaj-wrapper {
  position: relative;
  cursor: pointer;
  transition: transform 0.1s;
}

.ambalaj-wrapper:active { transform: scale(0.95); }

.ambalaj-ana {
  font-size: 130px;
  display: block;
  animation: sallan 1.8s ease-in-out infinite;
  filter: drop-shadow(0 0 60px rgba(124,58,237,0.6)) drop-shadow(0 0 30px rgba(168,85,247,0.4));
  user-select: none;
  cursor: pointer;
}

@keyframes sallan {
  0%, 100% { transform: rotate(-6deg) scale(1); filter: drop-shadow(0 0 60px rgba(124,58,237,0.6)); }
  25% { transform: rotate(6deg) scale(1.08); filter: drop-shadow(0 0 80px rgba(255,107,53,0.7)); }
  50% { transform: rotate(-4deg) scale(1.02); filter: drop-shadow(0 0 60px rgba(168,85,247,0.6)); }
  75% { transform: rotate(4deg) scale(1.05); filter: drop-shadow(0 0 70px rgba(255,61,127,0.6)); }
}

.tik-efekti {
  position: absolute;
  inset: -20px;
  border-radius: 50%;
  border: 3px solid rgba(124,58,237,0.5);
  animation: tik 1.5s ease-out infinite;
}

.tik-efekti:nth-child(2) { animation-delay: 0.5s; border-color: rgba(255,107,53,0.4); }
.tik-efekti:nth-child(3) { animation-delay: 1s; border-color: rgba(255,61,127,0.3); }

@keyframes tik {
  0% { transform: scale(0.8); opacity: 0.9; }
  100% { transform: scale(1.8); opacity: 0; }
}

.ac-yazi {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 22px;
  color: rgba(255,255,255,0.95);
  animation: nabiz 0.8s ease-in-out infinite;
  text-shadow: 0 0 20px rgba(124,58,237,0.8);
}

@keyframes nabiz {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.95); }
}

.kimden-on {
  font-size: 14px;
  color: rgba(255,255,255,0.5);
  letter-spacing: 2px;
}

/* ── AÇILMA ANİMASYONU ── */
#ekran-acilis {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

.acilis-emoji {
  font-size: 120px;
  animation: superPatla 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  filter: drop-shadow(0 0 60px rgba(255,215,0,0.8));
}

@keyframes superPatla {
  from { transform: scale(0) rotate(-30deg); opacity: 0; filter: blur(10px); }
  to { transform: scale(1) rotate(0deg); opacity: 1; filter: blur(0); }
}

/* ── EKRAN 2: AÇIK HEDİYE ── */
#ekran-acik {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  animation: mukemmelCikis 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}

@keyframes mukemmelCikis {
  from { opacity: 0; transform: translateY(50px) scale(0.8); filter: blur(6px); }
  to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
}

.hediye-foto {
  width: 110px; height: 110px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid rgba(255,255,255,0.3);
  display: none;
  animation: mukemmelCikis 0.6s both;
  animation-delay: 0.1s;
  box-shadow: 0 0 30px rgba(124,58,237,0.5);
}

.acik-emoji {
  font-size: 80px;
  filter: drop-shadow(0 0 40px rgba(255,255,255,0.4));
  animation: mukemmelCikis 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}

.kimden {
  font-size: 12px;
  color: rgba(255,255,255,0.5);
  letter-spacing: 2px;
  text-transform: uppercase;
  font-family: 'Syne', sans-serif;
  animation: mukemmelCikis 0.5s both;
  animation-delay: 0.2s;
}

.mesaj-kutu {
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.15);
  backdrop-filter: blur(20px);
  border-radius: 24px;
  padding: 28px 32px;
  max-width: 380px;
  animation: mukemmelCikis 0.5s both;
  animation-delay: 0.3s;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
}

.mesaj-text {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 22px;
  line-height: 1.4;
  color: #2B2D42;
}

.gonderen-text {
  font-size: 14px;
  color: rgba(255,255,255,0.5);
  margin-top: 12px;
  font-style: italic;
}

/* Alt butonlar */
.alt-butonlar {
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
  max-width: 300px;
  animation: yukariCik 0.5s both;
  animation-delay: 0.5s;
}

.sen-de-btn {
  padding: 16px;
  background: linear-gradient(135deg, #7c3aed, #a855f7);
  border: none;
  border-radius: 14px;
  color: #2B2D42;
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  transition: all 0.2s;
}

.sen-de-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(124,58,237,0.4);
}

.paylash-btn {
  padding: 14px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 14px;
  color: rgba(255,255,255,0.7);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
}

.paylash-btn:hover { background: rgba(255,255,255,0.15); color: #2B2D42; }

/* ── AMBALAJ SPESİFİK TEMALAR ── */
.tema-kutu .arka-plan { background: radial-gradient(ellipse at center, #1a0a2e 0%, #0a0510 100%); }
.tema-yumurta .arka-plan { background: radial-gradient(ellipse at center, #0a1a0a 0%, #050a05 100%); }
.tema-zarf .arka-plan { background: radial-gradient(ellipse at center, #1a1000 0%, #0a0800 100%); }
.tema-fiyonk .arka-plan { background: radial-gradient(ellipse at center, #1a0010 0%, #0a0008 100%); }
.tema-balon .arka-plan { background: radial-gradient(ellipse at center, #001a1a 0%, #000a0a 100%); }
.tema-sihir .arka-plan { background: radial-gradient(ellipse at center, #0a001a 0%, #050010 100%); }
</style>

<script>
// ── Veri Yükle ──
var veri = {
  ambalaj: 'kutu',
  ambalajEmoji: '',
  mesaj: 'Sana ozel bir sürprizim var!',
  gonderen: '',
  ses: 'konfeti',
  renk: 'mor',
  foto: null,
  anaKategori: 'genel'
};

var params = new URLSearchParams(window.location.search);
var test = params.get('test');
var id = params.get('id');

async function veriYukle() {
  if (id && !test) {
    // Supabase'den oku
    var sonuc = await DB.hediyeOku(id);
    if (sonuc.basarili) {
      var d = sonuc.veri;
      veri.ambalaj = d.ambalaj || 'kutu';
      veri.ambalajEmoji = d.ambalaj_emoji || '';
      veri.mesaj = d.mesaj || '';
      veri.gonderen = d.gonderen || '';
      veri.ses = d.ses || 'sessiz';
      veri.renk = d.renk || 'mor';
      veri.premium = true;
      veri.olusturma = d.olusturma || null;
      if (d.fotograf_url) veri.foto = d.fotograf_url;

    } else {
      var yerel = localStorage.getItem('surpriz_' + id);
      if (yerel) {
        try { veri = Object.assign(veri, JSON.parse(yerel)); } catch(e) {}
      }
    }
  } else if (test) {
    var kayitli = localStorage.getItem('hediye_data');
    if (kayitli) {
      try { veri = Object.assign(veri, JSON.parse(kayitli)); } catch(e) {}
    }
  }
  baslat();
}

    'yastik': '\uD83D\uDECF\uFE0F', 'kanape': '\uD83D\uDECB\uFE0F', 'ayi': '\uD83E\uDDF8',
    'pinokyo': '\uD83E\uDD25', 'yalan-sert': '\uD83D\uDCDC', 'maske': '\uD83C\uDFAD',
    'tac': '\uD83D\uDC51', 'tac2': '\uD83D\uDC51', 'drama': '\uD83C\uDFAD',
    'zarf': '\uD83D\uDC8C', 'mektup': '\uD83D\uDC8C', 'mektup2': '\uD83D\uDC8C', 'mektup3': '\uD83D\uDC8C', 'mektup4': '\uD83D\uDC8C', 'mektup5': '\uD83D\uDC8C',

// Emojiğe göre tema belirle
function temaAl(emoji) {
  if (!emoji) return 'tema-kutu';
  var komik = ['💩','🧻','💣','🪤','🐍','🤮','💀','⚠️','📢','🤡'];
  var romantik = ['💌','🌹','💝','💔','🫂','🌙','☀️','🌸','💐','👫'];
  var yesil = ['🐾','🦴','🐟','🌱'];
  if (komik.some(function(e) { return emoji.includes(e); })) return 'tema-yumurta';
  if (romantik.some(function(e) { return emoji.includes(e); })) return 'tema-fiyonk';
  if (yesil.some(function(e) { return emoji.includes(e); })) return 'tema-balon';
  return 'tema-kutu';
}

// Emojiğe göre açılış emojileri
function acilisEmojiAl(emoji) {
  if (!emoji) return ['✨', '🎊', '🎉'];
  var komik = ['💩','🧻','💣','🪤','🐍','🤮','💀'];
  var romantik = ['💌','🌹','💝','💔','🫂'];
  if (komik.some(function(e) { return emoji.includes(e); })) return ['💥', '😱', '🤣'];
  if (romantik.some(function(e) { return emoji.includes(e); })) return ['💕', '✨', '💝'];
  return ['✨', '🎊', '🎉'];
}

// Parçacık renkleri
const parcacikRenkleri = {
  'mor': ['#7c3aed', '#a855f7', '#c084fc', '#e9d5ff'],
  'pembe': ['#ff3d7f', '#ff6b9d', '#ffb3cc', '#ffe0ec'],
  'turuncu': ['#ff6b35', '#ff8c42', '#ffb347', '#ffd700'],
  'mavi': ['#06b6d4', '#0ea5e9', '#38bdf8', '#7dd3fc'],
  'yesil': ['#22c55e', '#4ade80', '#86efac', '#bbf7d0'],
  'sari': ['#f59e0b', '#fbbf24', '#fcd34d', '#fef08a'],
  'fuşya': ['#ec4899', '#f472b6', '#f9a8d4', '#fce7f3'],
  'gri': ['#64748b', '#94a3b8', '#cbd5e1', '#e2e8f0']
};

// ── Başlangıç ──
function baslat() {
  var ambalajId = veri.ambalaj || 'kutu';
  var ambalajEmoji = veri.ambalajEmoji || '';
  var ikon = ambalajBilgisiAl(ambalajId, ambalajEmoji);

  // Tema uygula
  document.body.className = temaAl(ikon);

  // İkon
  document.getElementById('ambalaj-ikon').innerHTML = ikon;
  document.getElementById('acik-emoji').innerHTML = ikon;

  // Kimden yazısı
  if (veri.gonderen) {
    document.getElementById('kimden-on').textContent = veri.gonderen + ' sana bir sürpriz gonderdi!';
  }

  // Fotoğraf
  if (veri.foto) {
    const img = document.getElementById('hediye-foto');
    img.src = veri.foto;
    img.style.display = 'block';
  }

}

// ── Ses Motoru ──
function sesiBaslat() {
  try {
    var AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return null;
    var ac = new AudioCtx();
    if (ac.state === 'suspended') ac.resume();
    return ac;
  } catch(e) { return null; }
}

function sesCal(id, volume) {
  try {
    var el = document.getElementById(id);
    if (!el) return;
    el.currentTime = 0;
    el.volume = volume || 1.0;
    el.play().catch(function() {});
  } catch(e) {}
}

function bipSesi() { sesCal('ses-bip', 0.8); }
function patlamaSesi() { sesCal('ses-patlama', 1.0); }
function konfetitSesi() { sesCal('ses-konfeti', 0.9); }

function sesHazirlaVeBaslat() {
  // Tüm sesleri kullanıcı etkileşimiyle unlock et
  try {
    ['ses-bip','ses-patlama','ses-konfeti'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) {
        var p = el.play();
        if (p) p.then(function() { el.pause(); el.currentTime = 0; }).catch(function(){});
        else { el.pause(); el.currentTime = 0; }
      }
    });
  } catch(e) {}
  // Hazırlık ekranını kapat
  document.getElementById('ses-hazirlik').style.display = 'none';
}

// baslat() artık veriYukle() tarafından çağrılıyor

// ── Ambalaj Aç ──
let acildi = false;

function ambalajAc() {
  if (acildi) return;
  acildi = true;

  const kapali = document.getElementById('ekran-kapali');
  const acilis = document.getElementById('ekran-acilis');
  const acik = document.getElementById('ekran-acik');

  // Kullanıcı tıkladı — sesleri hemen unlock et
  ['ses-bip','ses-patlama','ses-konfeti'].forEach(function(id) {
    try {
      var el = document.getElementById(id);
      if (!el) return;
      el.volume = 0.001;
      var p = el.play();
      if (p) p.then(function() { el.pause(); el.currentTime = 0; el.volume = 1; }).catch(function(){});
    } catch(e) {}
  });

  // Geri sayım overlay oluştur
  var overlay = document.createElement('div');
  overlay.id = 'gerisayim-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;';
  
  var sayimEl = document.createElement('div');
  sayimEl.id = 'sayim-rakam';
  sayimEl.style.cssText = 'font-size:160px;font-weight:900;color:#2B2D42;font-family:Syne,sans-serif;line-height:1;transition:all 0.1s;';
  
  var sayimYazi = document.createElement('div');
  sayimYazi.style.cssText = 'font-size:22px;color:rgba(255,255,255,0.6);font-family:Syne,sans-serif;font-weight:700;letter-spacing:3px;';
  sayimYazi.textContent = 'SÜRPRİZ AÇILIYOR...';
  
  overlay.appendChild(sayimEl);
  overlay.appendChild(sayimYazi);
  document.body.appendChild(overlay);

  // Geri sayım: 3... 2... 1...
  var sayilar = ['3', '2', '1', '🎉'];
  var renkler = ['#ff6b35', '#ff3d7f', '#7c3aed', '#ffd700'];
  var bipFrekanslari = [330, 440, 550, 880];
  var index = 0;

  function sayimAdimi() {
    if (index >= sayilar.length) {
      overlay.remove();
      gercekAcilis(kapali, acilis, acik);
      return;
    }

    sayimEl.textContent = sayilar[index];
    sayimEl.style.color = renkler[index];
    sayimEl.style.transform = 'scale(1.3)';
    
    // Ses: 3-2-1 bip, 🎉 patlama
    if (index < 3) {
      bipSesi();
    } else {
      patlamaSesi();
    }

    // Titreşim
    if (navigator.vibrate) {
      if (index < 3) navigator.vibrate([200, 50, 200]);
      else navigator.vibrate([400, 100, 400, 100, 600]);
    }

    setTimeout(function() { sayimEl.style.transform = 'scale(1)'; }, 100);

    index++;
    setTimeout(sayimAdimi, index < 4 ? 900 : 600);
  }

  // CSS sarsılma animasyonu ekle
  if (!document.getElementById('sarsilma-style')) {
    var style = document.createElement('style');
    style.id = 'sarsilma-style';
    style.textContent = '@keyframes sarsilma{0%,100%{transform:translate(0,0)}10%{transform:translate(-8px,8px)}20%{transform:translate(8px,-8px)}30%{transform:translate(-6px,6px)}40%{transform:translate(6px,-6px)}50%{transform:translate(-4px,4px)}60%{transform:translate(4px,-4px)}70%{transform:translate(-2px,2px)}80%{transform:translate(2px,-2px)}90%{transform:translate(0,0)}}';
    document.head.appendChild(style);
  }

  sayimAdimi();
}

function gercekAcilis(kapali, acilis, acik) {
  // Ekranı sarst
  document.body.style.animation = 'sarsilma 0.5s ease-out';
  setTimeout(function() { document.body.style.animation = ''; }, 500);

  // Titreşim patlaması
  if (navigator.vibrate) navigator.vibrate([300, 80, 300, 80, 500, 100, 500]);

  // Konfeti sesi
  setTimeout(function() { konfetitSesi(); }, 200);

  // Kapanı gizle
  kapali.style.animation = 'patla 0.3s reverse both';
  setTimeout(function() {
    kapali.style.display = 'none';

    // Açılış efekti
    acilis.style.display = 'flex';
    var ambalajId = veri.ambalaj || 'kutu';
    var ambalajEmoji = veri.ambalajEmoji || '';
    var ikon = ambalajBilgisiAl(ambalajId, ambalajEmoji);
    var emojiler = acilisEmojiAl(ikon);
    var i = 0;
    var interval = setInterval(function() {
      document.getElementById('acilis-emoji').textContent = emojiler[i % emojiler.length];
      i++;
      if (i >= 6) clearInterval(interval);
    }, 120);

    // Parçacıkları başlat

    setTimeout(function() { parcaciklariBaslat(); }, 100);

    // Asıl içeriği göster
    setTimeout(function() {
      acilis.style.display = 'none';
      acik.style.display = 'flex';

      // Mesajı yavaşça göster
      var mesajEl = document.getElementById('mesaj-text');
      yaziyazdir(mesajEl, veri.mesaj || 'Sana özel bir sürprizim var! 🎉');

      if (veri.gonderen) {
        document.getElementById('gonderen-yazi').textContent = '— ' + veri.gonderen;
        document.getElementById('kimden-yazi').textContent = veri.gonderen.toUpperCase() + "'TAN SÜRPRİZ";
      }

    }, 800);

  }, 400);
}

// ── Typewriter efekti ──
function yaziyazdir(el, metin) {
  el.textContent = '';
  let i = 0;
  const interval = setInterval(() => {
    el.textContent += metin[i];
    i++;
    if (i >= metin.length) clearInterval(interval);
  }, 40);
}

// ── Parçacıklar ──
function parcaciklariBaslat() {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const renkler = parcacikRenkleri[veri.renk] || parcacikRenkleri['mor'];
  const ekstraRenkler = ['#ffd700', '#ff6b35', '#ff3d7f', '#22c55e', '#06b6d4', '#ffffff'];
  const tumRenkler = [...renkler, ...ekstraRenkler];

  const parcaciklar = [];

  // 3 noktadan patlama: merkez, sol, sağ
  const patlamaNoktalari = [
    { x: canvas.width/2, y: canvas.height/2 },
    { x: canvas.width*0.2, y: canvas.height*0.3 },
    { x: canvas.width*0.8, y: canvas.height*0.3 },
  ];

  patlamaNoktalari.forEach(function(nokta, ni) {
    for (let i = 0; i < 100; i++) {
      const aci = (Math.random() * Math.PI * 2);
      const hiz = 5 + Math.random() * 15;
      const tip = Math.random();
      parcaciklar.push({
        x: nokta.x, y: nokta.y,
        vx: Math.cos(aci) * hiz,
        vy: Math.sin(aci) * hiz - Math.random() * 10,
        renk: tumRenkler[Math.floor(Math.random() * tumRenkler.length)],
        tip: tip < 0.4 ? 'kare' : tip < 0.7 ? 'daire' : 'uzun',
        boyut: 5 + Math.random() * 14,
        opaklık: 1,
        rot: Math.random() * Math.PI * 2,
        rotV: (Math.random() - 0.5) * 0.25,
        yerCekimi: 0.06 + Math.random() * 0.06,
        gecikme: ni * 120
      });
    }
  });

  // Yukarıdan yağan konfetiler
  for (let i = 0; i < 150; i++) {
    parcaciklar.push({
      x: Math.random() * canvas.width,
      y: -20 - Math.random() * 200,
      vx: (Math.random() - 0.5) * 4,
      vy: 1.5 + Math.random() * 4,
      renk: tumRenkler[Math.floor(Math.random() * tumRenkler.length)],
      tip: Math.random() > 0.5 ? 'kare' : 'uzun',
      boyut: 6 + Math.random() * 12,
      opaklık: 1,
      rot: Math.random() * Math.PI * 2,
      rotV: (Math.random() - 0.5) * 0.2,
      yerCekimi: 0.03,
      gecikme: Math.random() * 1500
    });
  }

  let baslangic = null;

  function ciz(timestamp) {
    if (!baslangic) baslangic = timestamp;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let devam = false;
    parcaciklar.forEach(function(p) {
      if (timestamp - baslangic < p.gecikme) { devam = true; return; }

      p.x += p.vx;
      p.y += p.vy;
      p.vy += p.yerCekimi;
      p.vx *= 0.99;
      p.rot += p.rotV;
      p.opaklık -= 0.004;

      if (p.opaklık > 0 && p.y < canvas.height + 20) {
        devam = true;
        ctx.save();
        ctx.globalAlpha = p.opaklık;
        ctx.fillStyle = p.renk;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);

        if (p.tip === 'kare') {
          ctx.fillRect(-p.boyut/2, -p.boyut/2, p.boyut, p.boyut);
        } else if (p.tip === 'daire') {
          ctx.beginPath();
          ctx.arc(0, 0, p.boyut/2, 0, Math.PI*2);
          ctx.fill();
        } else {
          ctx.fillRect(-p.boyut/6, -p.boyut/2, p.boyut/3, p.boyut);
        }
        ctx.restore();
      }
    });

    if (devam) requestAnimationFrame(ciz);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  requestAnimationFrame(ciz);
}
// ── Ses ──
function sesCal(tip) {
  if (tip === 'sessiz') return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();

    if (tip === 'konfeti') {
      [523, 659, 784, 1047, 1319].forEach((f, i) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = f;
        o.type = 'sine';
        g.gain.setValueAtTime(0.25, ctx.currentTime + i * 0.1);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.1 + 0.4);
        o.start(ctx.currentTime + i * 0.1);
        o.stop(ctx.currentTime + i * 0.1 + 0.4);
      });
    } else if (tip === 'muzik') {
      [262, 330, 392, 523, 392, 330, 262].forEach((f, i) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = f;
        o.type = 'triangle';
        g.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.15);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.15 + 0.3);
        o.start(ctx.currentTime + i * 0.15);
        o.stop(ctx.currentTime + i * 0.15 + 0.3);
      });
    } else if (tip === 'kalp') {
      [0, 0.4].forEach(t => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = 'sine';
        o.frequency.setValueAtTime(80, ctx.currentTime + t);
        g.gain.setValueAtTime(0.4, ctx.currentTime + t);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.3);
        o.start(ctx.currentTime + t);
        o.stop(ctx.currentTime + t + 0.3);
      });
    } else if (tip === 'alkis') {
      for (let i = 0; i < 5; i++) {
        const bufSize = ctx.sampleRate * 0.1;
        const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let j = 0; j < bufSize; j++) data[j] = Math.random() * 2 - 1;
        const src = ctx.createBufferSource();
        const g = ctx.createGain();
        src.buffer = buf;
        src.connect(g); g.connect(ctx.destination);
        g.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.12);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.12 + 0.1);
        src.start(ctx.currentTime + i * 0.12);
      }
    }
  } catch(e) {}
}

// ── Paylaş ──
function paylash() {
  if (navigator.share) {
    navigator.share({
      title: 'Sürprizim var! 🎁',
      text: 'Bak ne aldım! Sen de birine gönder:',
      url: window.location.origin
    });
  } else {
    navigator.clipboard.writeText(window.location.origin).then(() => {
      alert('Site adresi kopyalandı!');
    });
  }
}

window.addEventListener('resize', () => {
  const canvas = document.getElementById('canvas');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

// Veriyi yükle ve başlat
veriYukle();
