<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sürprizin Var! 🎁</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'DM Sans', sans-serif;
  background: #0a0a0f;
  color: white;
  min-height: 100vh;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ── CANVAS ── */
#canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
}

/* ── ARKA PLAN ── */
.arka-plan {
  position: fixed;
  inset: 0;
  z-index: 0;
  transition: background 1s;
}

/* ── ANA İÇERİK ── */
.icerik {
  position: relative;
  z-index: 10;
  text-align: center;
  padding: 40px 24px;
  max-width: 480px;
  width: 100%;
}

/* ── EKRAN 1: KAPALII AMBALAJ ── */
#ekran-kapali {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}

.ambalaj-wrapper {
  position: relative;
  cursor: pointer;
  transition: transform 0.1s;
}

.ambalaj-wrapper:active { transform: scale(0.95); }

.ambalaj-ana {
  font-size: 120px;
  display: block;
  animation: sallan 2s ease-in-out infinite;
  filter: drop-shadow(0 0 40px rgba(124,58,237,0.4));
  user-select: none;
}

@keyframes sallan {
  0%, 100% { transform: rotate(-5deg) scale(1); }
  25% { transform: rotate(5deg) scale(1.05); }
  50% { transform: rotate(-3deg) scale(1); }
  75% { transform: rotate(3deg) scale(1.02); }
}

.tik-efekti {
  position: absolute;
  inset: -20px;
  border-radius: 50%;
  border: 3px solid rgba(124,58,237,0.4);
  animation: tik 1.5s ease-out infinite;
}

.tik-efekti:nth-child(2) { animation-delay: 0.5s; }
.tik-efekti:nth-child(3) { animation-delay: 1s; }

@keyframes tik {
  0% { transform: scale(0.8); opacity: 0.8; }
  100% { transform: scale(1.4); opacity: 0; }
}

.ac-yazi {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 20px;
  color: rgba(255,255,255,0.9);
  animation: nabiz 1s ease-in-out infinite;
}

@keyframes nabiz {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.6; transform: scale(0.97); }
}

.kimden-on {
  font-size: 14px;
  color: rgba(255,255,255,0.4);
  letter-spacing: 1px;
}

/* ── AÇILMA ANİMASYONU ── */
#ekran-acilis {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

.acilis-emoji {
  font-size: 100px;
  animation: patla 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}

@keyframes patla {
  from { transform: scale(0) rotate(-20deg); opacity: 0; }
  to { transform: scale(1) rotate(0deg); opacity: 1; }
}

/* ── EKRAN 2: AÇIK HEDİYE ── */
#ekran-acik {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  animation: yukariCik 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}

@keyframes yukariCik {
  from { opacity: 0; transform: translateY(40px) scale(0.9); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.hediye-foto {
  width: 100px; height: 100px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid rgba(255,255,255,0.2);
  display: none;
  animation: yukariCik 0.6s both;
  animation-delay: 0.1s;
}

.acik-emoji {
  font-size: 72px;
  filter: drop-shadow(0 0 30px rgba(255,255,255,0.3));
  animation: yukariCik 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}

.kimden {
  font-size: 12px;
  color: rgba(255,255,255,0.4);
  letter-spacing: 2px;
  text-transform: uppercase;
  font-family: 'Syne', sans-serif;
  animation: yukariCik 0.5s both;
  animation-delay: 0.2s;
}

.mesaj-kutu {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);
  border-radius: 20px;
  padding: 24px 28px;
  max-width: 380px;
  animation: yukariCik 0.5s both;
  animation-delay: 0.3s;
}

.mesaj-text {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 22px;
  line-height: 1.4;
  color: white;
}

.gonderen-text {
  font-size: 14px;
  color: rgba(255,255,255,0.5);
  margin-top: 12px;
  font-style: italic;
}

/* Alt butonlar */
.alt-butonlar {
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
  max-width: 300px;
  animation: yukariCik 0.5s both;
  animation-delay: 0.5s;
}

.sen-de-btn {
  padding: 16px;
  background: linear-gradient(135deg, #7c3aed, #a855f7);
  border: none;
  border-radius: 14px;
  color: white;
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  transition: all 0.2s;
}

.sen-de-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(124,58,237,0.4);
}

.paylash-btn {
  padding: 14px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 14px;
  color: rgba(255,255,255,0.7);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
}

.paylash-btn:hover { background: rgba(255,255,255,0.15); color: white; }

/* ── AMBALAJ SPESİFİK TEMALAR ── */
.tema-kutu .arka-plan { background: radial-gradient(ellipse at center, #1a0a2e 0%, #0a0510 100%); }
.tema-yumurta .arka-plan { background: radial-gradient(ellipse at center, #0a1a0a 0%, #050a05 100%); }
.tema-zarf .arka-plan { background: radial-gradient(ellipse at center, #1a1000 0%, #0a0800 100%); }
.tema-fiyonk .arka-plan { background: radial-gradient(ellipse at center, #1a0010 0%, #0a0008 100%); }
.tema-balon .arka-plan { background: radial-gradient(ellipse at center, #001a1a 0%, #000a0a 100%); }
.tema-sihir .arka-plan { background: radial-gradient(ellipse at center, #0a001a 0%, #050010 100%); }
</style>
</head>
<body class="tema-kutu">

<div class="arka-plan"></div>
<canvas id="canvas"></canvas>

<div class="icerik">

  <!-- EKRAN 1: KAPALI -->
  <div id="ekran-kapali">
    <div class="ambalaj-wrapper" onclick="ambalajAc()">
      <div class="tik-efekti"></div>
      <div class="tik-efekti"></div>
      <div class="tik-efekti"></div>
      <span class="ambalaj-ana" id="ambalaj-ikon">🎁</span>
    </div>
    <div class="ac-yazi">👆 Dokun ve Aç!</div>
    <div class="kimden-on" id="kimden-on">Sana bir sürpriz gönderildi</div>
  </div>

  <!-- EKRAN: AÇILIŞ -->
  <div id="ekran-acilis">
    <div class="acilis-emoji" id="acilis-emoji">✨</div>
  </div>

  <!-- EKRAN 2: AÇIK -->
  <div id="ekran-acik">
    <img class="hediye-foto" id="hediye-foto" src="" alt="">
    <div class="acik-emoji" id="acik-emoji">🎁</div>
    <div class="kimden" id="kimden-yazi">SÜRPRİZİN VAR</div>
    <div class="mesaj-kutu">
      <div class="mesaj-text" id="mesaj-text"></div>
      <div class="gonderen-text" id="gonderen-yazi"></div>
    </div>
    <div class="alt-butonlar">
      <button class="sen-de-btn" onclick="window.location.href='index.html'">
        🎁 Sen de Birine Gönder
      </button>
      <button class="paylash-btn" onclick="paylash()">
        📤 Paylaş
      </button>
    </div>
  </div>

</div>

<script src="config.js"></script>
<script>
// ── Veri Yükle ──
var veri = {
  ambalaj: 'kutu',
  ambalajEmoji: '',
  mesaj: 'Sana ozel bir sürprizim var!',
  gonderen: '',
  ses: 'konfeti',
  renk: 'mor',
  foto: null,
  anaKategori: 'genel'
};

var params = new URLSearchParams(window.location.search);
var test = params.get('test');
var id = params.get('id');

async function veriYukle() {
  if (id && !test) {
    // Supabase'den oku
    var sonuc = await DB.hediyeOku(id);
    if (sonuc.basarili) {
      var d = sonuc.veri;
      veri.ambalaj = d.ambalaj || 'kutu';
      veri.ambalajEmoji = d.ambalaj_emoji || '';
      veri.mesaj = d.mesaj || '';
      veri.gonderen = d.gonderen || '';
      veri.ses = d.ses || 'sessiz';
      veri.renk = d.renk || 'mor';
      if (d.fotoğraf_url) veri.foto = d.fotoğraf_url;
    } else {
      // Supabase'de yoksa localStorage'dan dene
      var yerel = localStorage.getItem('sürpriz_' + id);
      if (yerel) {
        try { veri = Object.assign(veri, JSON.parse(yerel)); } catch(e) {}
      }
    }
  } else if (test) {
    // Test modu: localStorage'dan oku
    var kayitli = localStorage.getItem('hediye_data');
    if (kayitli) {
      try { veri = Object.assign(veri, JSON.parse(kayitli)); } catch(e) {}
    }
  }
  baslat();
}

// Ambalaj ID'sine göre emoji ve tema belirle
function ambalajBilgisiAl(ambalajId, ambalajEmoji) {
  if (ambalajEmoji && ambalajEmoji.length > 0 && !ambalajEmoji.includes('&#')) return ambalajEmoji;
  
  var eslesme = {
    'bok': '\uD83D\uDCA9', 'bok-kutu': '\uD83D\uDCA9', 'bok-kutu2': '\uD83D\uDCA9', 'bok2': '\uD83D\uDCA9', 'bok-kupa': '\uD83D\uDCA9',
    'tuvalet': '\uD83E\uDDFB', 'tuvalet2': '\uD83E\uDDFB', 'tuvalet3': '\uD83E\uDDFB', 'rulo': '\uD83E\uDDFB',
    'bomba': '\uD83D\uDCA3', 'bomba-kutu': '\uD83D\uDCA3', 'bomba2': '\uD83D\uDCA3', 'bomba3': '\uD83D\uDCA3',
    'tuzak': '\uD83E\uDE9E', 'tuzak-kutu': '\uD83E\uDE9E',
    'yilan': '\uD83D\uDC0D', 'yilan-kutu': '\uD83D\uDC0D',
    'kusma': '\uD83E\uDD2E', 'kusma2': '\uD83E\uDD2E',
    'kafatasi': '\uD83D\uDC80',
    'tehlike': '\u26A0\uFE0F', 'tehlike2': '\u26A0\uFE0F', 'tehlike3': '\u26A0\uFE0F',
    'megafon': '\uD83D\uDCE2', 'gazete': '\uD83D\uDCF0', 'mikrofon': '\uD83C\uDFA4',
    'palyaco': '\uD83E\uDD21', 'sahte-kupa': '\uD83C\uDFC6', 'sertifika2': '\uD83D\uDCDC',
    'yastik': '\uD83D\uDECF\uFE0F', 'kanape': '\uD83D\uDECB\uFE0F', 'ayi': '\uD83E\uDDF8',
    'pinokyo': '\uD83E\uDD25', 'yalan-sert': '\uD83D\uDCDC', 'maske': '\uD83C\uDFAD',
    'tac': '\uD83D\uDC51', 'tac2': '\uD83D\uDC51', 'drama': '\uD83C\uDFAD',
    'zarf': '\uD83D\uDC8C', 'mektup': '\uD83D\uDC8C', 'mektup2': '\uD83D\uDC8C', 'mektup3': '\uD83D\uDC8C', 'mektup4': '\uD83D\uDC8C', 'mektup5': '\uD83D\uDC8C',
    'gul': '\uD83C\uDF39', 'gul2': '\uD83C\uDF39', 'gul3': '\uD83C\uDF39', 'gul4': '\uD83C\uDF39', 'gul5': '\uD83C\uDF39', 'gul6': '\uD83C\uDF39', 'gul7': '\uD83C\uDF39', 'gul8': '\uD83C\uDF39',
    'kalp': '\uD83D\uDC9D', 'kalp2': '\uD83D\uDC9D', 'kalp3': '\uD83D\uDC9D', 'kalp4': '\uD83D\uDC9D', 'kalp5': '\uD83D\uDC9D', 'kalp6': '\uD83D\uDC9D', 'kalp-kupa': '\uD83D\uDC9D',
    'kirik': '\uD83D\uDC94',
    'sarilma': '\uD83E\uDEF6', 'sarilma2': '\uD83E\uDEF6',
    'ay': '\uD83C\uDF19', 'ay2': '\uD83C\uDF19',
    'gunes': '\u2600\uFE0F',
    'cicek': '\uD83C\uDF38', 'cicek2': '\uD83C\uDF38', 'cicek3': '\uD83D\uDC90', 'cicek4': '\uD83C\uDF38', 'cicek5': '\uD83D\uDC90',
    'cift': '\uD83D\uDC6B',
    'pasta': '\uD83C\uDF82',
    'balon': '\uD83C\uDF88',
    'hediye': '\uD83C\uDF81', 'hediye2': '\uD83C\uDF81',
    'diploma': '\uD83C\uDF93',
    'kupa': '\uD83C\uDFC6', 'kupa2': '\uD83C\uDFC6', 'kupa3': '\uD83C\uDFC6', 'kupa4': '\uD83C\uDFC6', 'kupa5': '\uD83C\uDFC6',
    'altin-kupa': '\uD83C\uDFC6',
    'konfeti': '\uD83C\uDF8A', 'konfeti2': '\uD83C\uDF8A', 'konfeti3': '\uD83C\uDF8A',
    'madalya': '\uD83E\uDD47', 'madalya2': '\uD83E\uDD47',
    'sertifika': '\uD83D\uDCDC', 'sertifika3': '\uD83D\uDCDC', 'deha': '\uD83D\uDCDC',
    'bebek-sepet': '\uD83D\uDC76', 'biberon': '\uD83C\uDF7C', 'fiyonk': '\uD83C\uDF80',
    'canta': '\uD83D\uDCBC',
    'roket': '\uD83D\uDE80',
    'sihir': '\uD83E\uDE84', 'sihir2': '\uD83E\uDE84',
    'pati': '\uD83D\uDC3E', 'kemik': '\uD83E\uDDB4', 'balik': '\uD83D\uDC1F',
    'ucak': '\u2708\uFE0F', 'bavul': '\uD83E\uDDF3', 'harita': '\uD83D\uDDFA\uFE0F',
    'kravat': '\uD83D\uDC54',
    'hilal': '\uD83C\uDF19', 'bayram-paket': '\uD83C\uDF81', 'altin': '\u2728',
    'agac': '\uD83C\uDF84', 'yilbasi-kutu': '\uD83C\uDF81', 'kardan': '\u26C4',
    'beyin': '\uD83E\uDDE0',
    'laptop': '\uD83D\uDCBB', 'saat': '\u23F0', 'grafik': '\uD83D\uDCCA',
    'ilac': '\uD83D\uDC8A'
  };
  return eslesme[ambalajId] || '\uD83C\uDF81';
}

// Emojiğe göre tema belirle
function temaAl(emoji) {
  if (!emoji) return 'tema-kutu';
  var komik = ['💩','🧻','💣','🪤','🐍','🤮','💀','⚠️','📢','🤡'];
  var romantik = ['💌','🌹','💝','💔','🫂','🌙','☀️','🌸','💐','👫'];
  var yesil = ['🐾','🦴','🐟','🌱'];
  if (komik.some(function(e) { return emoji.includes(e); })) return 'tema-yumurta';
  if (romantik.some(function(e) { return emoji.includes(e); })) return 'tema-fiyonk';
  if (yesil.some(function(e) { return emoji.includes(e); })) return 'tema-balon';
  return 'tema-kutu';
}

// Emojiğe göre açılış emojileri
function acilisEmojiAl(emoji) {
  if (!emoji) return ['✨', '🎊', '🎉'];
  var komik = ['💩','🧻','💣','🪤','🐍','🤮','💀'];
  var romantik = ['💌','🌹','💝','💔','🫂'];
  if (komik.some(function(e) { return emoji.includes(e); })) return ['💥', '😱', '🤣'];
  if (romantik.some(function(e) { return emoji.includes(e); })) return ['💕', '✨', '💝'];
  return ['✨', '🎊', '🎉'];
}

// Parçacık renkleri
const parcacikRenkleri = {
  'mor': ['#7c3aed', '#a855f7', '#c084fc', '#e9d5ff'],
  'pembe': ['#ff3d7f', '#ff6b9d', '#ffb3cc', '#ffe0ec'],
  'turuncu': ['#ff6b35', '#ff8c42', '#ffb347', '#ffd700'],
  'mavi': ['#06b6d4', '#0ea5e9', '#38bdf8', '#7dd3fc'],
  'yesil': ['#22c55e', '#4ade80', '#86efac', '#bbf7d0'],
  'sari': ['#f59e0b', '#fbbf24', '#fcd34d', '#fef08a'],
  'fuşya': ['#ec4899', '#f472b6', '#f9a8d4', '#fce7f3'],
  'gri': ['#64748b', '#94a3b8', '#cbd5e1', '#e2e8f0']
};

// ── Başlangıç ──
function baslat() {
  var ambalajId = veri.ambalaj || 'kutu';
  var ambalajEmoji = veri.ambalajEmoji || '';
  var ikon = ambalajBilgisiAl(ambalajId, ambalajEmoji);

  // Tema uygula
  document.body.className = temaAl(ikon);

  // İkon
  document.getElementById('ambalaj-ikon').innerHTML = ikon;
  document.getElementById('acik-emoji').innerHTML = ikon;

  // Kimden yazısı
  if (veri.gonderen) {
    document.getElementById('kimden-on').textContent = veri.gonderen + ' sana bir sürpriz gonderdi!';
  }

  // Fotoğraf
  if (veri.foto) {
    const img = document.getElementById('hediye-foto');
    img.src = veri.foto;
    img.style.display = 'block';
  }
}

// baslat() artık veriYukle() tarafından çağrılıyor

// ── Ambalaj Aç ──
let acildi = false;

function ambalajAc() {
  if (acildi) return;
  acildi = true;

  // Titreşim
  if (navigator.vibrate) navigator.vibrate([200, 100, 300]);

  // Ses çal
  sesCal(veri.ses);

  // Açılış animasyonu
  const kapali = document.getElementById('ekran-kapali');
  const acilis = document.getElementById('ekran-acilis');
  const acik = document.getElementById('ekran-acik');

  // 1. Kapanı gizle
  kapali.style.animation = 'patla 0.3s reverse both';
  setTimeout(() => {
    kapali.style.display = 'none';

    // 2. Açılış efekti göster
    acilis.style.display = 'flex';
    var ambalajId = veri.ambalaj || 'kutu';
    var ambalajEmoji = veri.ambalajEmoji || '';
    var ikon = ambalajBilgisiAl(ambalajId, ambalajEmoji);
    var emojiler = acilisEmojiAl(ikon);
    let i = 0;
    const interval = setInterval(() => {
      document.getElementById('acilis-emoji').textContent = emojiler[i % emojiler.length];
      i++;
      if (i >= 4) clearInterval(interval);
    }, 150);

    // 3. Parçacıkları başlat
    setTimeout(() => parcaciklariBaslat(), 100);

    // 4. Asıl içeriği göster
    setTimeout(() => {
      acilis.style.display = 'none';
      acik.style.display = 'flex';

      // Mesajı doldur
      const mesajEl = document.getElementById('mesaj-text');
      yaziyazdir(mesajEl, veri.mesaj || 'Sana özel bir sürprizim var! 🎉');

      if (veri.gonderen) {
        document.getElementById('gonderen-yazi').textContent = '— ' + veri.gonderen;
        document.getElementById('kimden-yazi').textContent = veri.gonderen.toUpperCase() + "'TAN SÜRPRİZ";
      }

    }, 700);

  }, 400);
}

// ── Typewriter efekti ──
function yaziyazdir(el, metin) {
  el.textContent = '';
  let i = 0;
  const interval = setInterval(() => {
    el.textContent += metin[i];
    i++;
    if (i >= metin.length) clearInterval(interval);
  }, 40);
}

// ── Parçacıklar ──
function parcaciklariBaslat() {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const renkler = parcacikRenkleri[veri.renk] || parcacikRenkleri['mor'];

  // Ambalaja göre semboller
  const semboller = {
    'kutu': ['🎁', '🎊', '⭐', '✨', '🌟'],
    'yumurta': ['🥚', '✨', '🌟', '💛', '⭐'],
    'zarf': ['💌', '❤️', '✨', '💕', '⭐'],
    'fiyonk': ['🎀', '💝', '✨', '💕', '🌸'],
    'balon': ['🎈', '🎊', '✨', '⭐', '🌟'],
    'sihir': ['✨', '⭐', '🌟', '💫', '🪄']
  }[veri.ambalaj] || ['✨', '⭐', '🌟'];

  const parcaciklar = [];

  // Ekran ortasından patlama
  for (let i = 0; i < 80; i++) {
    const aci = (Math.random() * Math.PI * 2);
    const hiz = 3 + Math.random() * 8;
    parcaciklar.push({
      x: canvas.width / 2,
      y: canvas.height / 2,
      vx: Math.cos(aci) * hiz,
      vy: Math.sin(aci) * hiz - Math.random() * 5,
      renk: renkler[Math.floor(Math.random() * renkler.length)],
      sembol: Math.random() > 0.5 ? semboller[Math.floor(Math.random() * semboller.length)] : null,
      boyut: 6 + Math.random() * 10,
      opaklık: 1,
      yer: Math.random() > 0.5,
      rot: Math.random() * Math.PI * 2,
      rotHiz: (Math.random() - 0.5) * 0.2
    });
  }

  // Sürekli yağan parçacıklar
  for (let i = 0; i < 40; i++) {
    parcaciklar.push({
      x: Math.random() * canvas.width,
      y: -50 - Math.random() * 300,
      vx: (Math.random() - 0.5) * 2,
      vy: 1.5 + Math.random() * 2.5,
      renk: renkler[Math.floor(Math.random() * renkler.length)],
      sembol: semboller[Math.floor(Math.random() * semboller.length)],
      boyut: 14 + Math.random() * 18,
      opaklık: 0.8,
      yer: false,
      rot: Math.random() * Math.PI * 2,
      rotHiz: (Math.random() - 0.5) * 0.05,
      yagmur: true
    });
  }

  let frame = 0;

  function ciz() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    frame++;

    parcaciklar.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.rotHiz;

      if (!p.yagmur) {
        p.vy += 0.15; // yerçekimi
        p.opaklık -= 0.008;
      } else {
        if (p.y > canvas.height + 60) {
          p.y = -60;
          p.x = Math.random() * canvas.width;
        }
      }

      if (p.opaklık <= 0) return;

      ctx.save();
      ctx.globalAlpha = Math.max(0, p.opaklık);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);

      if (p.sembol) {
        ctx.font = `${p.boyut}px serif`;
        ctx.fillText(p.sembol, -p.boyut/2, p.boyut/2);
      } else {
        ctx.fillStyle = p.renk;
        if (p.yer) {
          ctx.fillRect(-p.boyut/2, -p.boyut/2, p.boyut, p.boyut/2);
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, p.boyut/2, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();
    });

    requestAnimationFrame(ciz);
  }

  ciz();
}

// ── Ses ──
function sesCal(tip) {
  if (tip === 'sessiz') return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();

    if (tip === 'konfeti') {
      [523, 659, 784, 1047, 1319].forEach((f, i) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = f;
        o.type = 'sine';
        g.gain.setValueAtTime(0.25, ctx.currentTime + i * 0.1);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.1 + 0.4);
        o.start(ctx.currentTime + i * 0.1);
        o.stop(ctx.currentTime + i * 0.1 + 0.4);
      });
    } else if (tip === 'muzik') {
      [262, 330, 392, 523, 392, 330, 262].forEach((f, i) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = f;
        o.type = 'triangle';
        g.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.15);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.15 + 0.3);
        o.start(ctx.currentTime + i * 0.15);
        o.stop(ctx.currentTime + i * 0.15 + 0.3);
      });
    } else if (tip === 'kalp') {
      [0, 0.4].forEach(t => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = 'sine';
        o.frequency.setValueAtTime(80, ctx.currentTime + t);
        g.gain.setValueAtTime(0.4, ctx.currentTime + t);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.3);
        o.start(ctx.currentTime + t);
        o.stop(ctx.currentTime + t + 0.3);
      });
    } else if (tip === 'alkis') {
      for (let i = 0; i < 5; i++) {
        const bufSize = ctx.sampleRate * 0.1;
        const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let j = 0; j < bufSize; j++) data[j] = Math.random() * 2 - 1;
        const src = ctx.createBufferSource();
        const g = ctx.createGain();
        src.buffer = buf;
        src.connect(g); g.connect(ctx.destination);
        g.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.12);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.12 + 0.1);
        src.start(ctx.currentTime + i * 0.12);
      }
    }
  } catch(e) {}
}

    });
  }
}

  const canvas = document.getElementById('canvas');

  canvas.height = window.innerHeight;
